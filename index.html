<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Split</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script>
    window.addEventListener('load', function() {
      if (typeof window.jspdf !== 'undefined') {
        window.jsPDF = window.jspdf.jsPDF;
      }
    });
  </script>
</head>
<body>

  
  <nav id="sidebar" class="sidebar" aria-label="Main menu">
    <button onclick="closeSidebar()" aria-label="Close menu">X</button>
    <ul>
      <li onclick="showTrips()">My Trips</li>
      <li onclick="showResults()">Results</li>
      <li onclick="showProfile()">Profile</li>
    </ul>
  </nav>

  
  <div id="loader" class="loader" role="status" aria-live="polite">
    <div class="loader-circle"></div>
    <div class="loader-circle"></div>
    <div class="loader-circle"></div>
  </div>

  <
  <main id="login" class="page">
    <section class="card">
      <h2>Welcome Back</h2>
      <label for="user">Username</label>
      <input type="text" id="user" placeholder="Username">

      <label for="pass">Password</label>
      <input type="password" id="pass" placeholder="Password">

      <button onclick="login()">Login</button>
      <p id="msg"></p>
      <p><small>Demo: user / pass</small></p>
    </section>
  </main>

 
  <main id="trips" class="page hide">
    <header class="top">
      <button onclick="openSidebar()">Menu</button>
      <h2>My Trips</h2>
      <label for="currency" class="visually-hidden">Currency</label>
      <select id="currency" onchange="changeCurrency()">
        <option value="INR">INR</option>
        <option value="USD">USD</option>
        <option value="EUR">EUR</option>
      </select>
    </header>

    <section class="card">
      <button onclick="showForm()">Add Trip</button>

      <div id="form" class="hide">
        <label for="tripname">Trip name</label>
        <input type="text" id="tripname" placeholder="Trip name">
        <button onclick="addTrip()">Save</button>
        <button onclick="hideForm()">Cancel</button>
      </div>

      <ul id="triplist"></ul>
    </section>
  </main>

  
  <main id="calc" class="page hide">
    <header class="top">
      <button onclick="showTrips()">Back</button>
      <h2 id="tripTitle"></h2>
      <label for="calcCurrency" class="visually-hidden">Currency</label>
      <select id="calcCurrency" onchange="changeCurrency()">
        <option value="INR">INR</option>
        <option value="USD">USD</option>
        <option value="EUR">EUR</option>
      </select>
    </header>

    <section class="card">
      <h3>People</h3>
      <label for="person">Name</label>
      <input type="text" id="person" placeholder="Name">
      <button onclick="addPerson()">Add</button>
      <ul id="people"></ul>
    </section>

    <section class="card">
      <h3>Expenses</h3>
      <label for="desc">Description</label>
      <input type="text" id="desc" placeholder="Description">
      <label for="amount">Amount</label>
      <input type="number" id="amount" placeholder="Amount">
      <button onclick="addExpense()">Add</button>
      <ul id="expenses"></ul>
    </section>

    <section class="card">
      <button onclick="calculate()">Calculate</button>
      <div id="result"></div>
      <button id="download" onclick="downloadPdf()" class="hide">Download PDF</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
